plugins {
    id 'java-library'
    id "io.freefair.lombok" version "9.2.0"
    id 'io.qameta.allure' version '4.1.0'
}

repositories {
    mavenCentral()
}

def restAssuredVersion = "6.0.1",
    allureVersion = "2.19.0",
    junitVersion = "6.0.0",
    slf4jVersion = "2.0.18"

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit6 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation platform ("org.junit:junit-bom:$junitVersion")
    testImplementation "net.datafaker:datafaker:2.5.4"
    testImplementation "org.assertj:assertj-core:3.27.7"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "tools.jackson.core:jackson-databind:3.1.0"
    testImplementation "io.rest-assured:rest-assured:$restAssuredVersion"
    testImplementation "io.qameta.allure:allure-rest-assured:2.35.5"
    testImplementation "io.rest-assured:json-schema-validator:$restAssuredVersion"
    testImplementation "org.slf4j:slf4j-simple:$slf4jVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard-error", "standard-out"
            exceptionFormat "short"
        }
    }
}